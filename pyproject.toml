[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
[tool.ruff]
line-length = 140
target-version = "py312"
src = ["apps/api/src", "packages/evaluation-core/src", "packages/bigquery-adapter/src", "packages/openai-adapter/src", "apps/workers/src", "apps/console-executor/src"]
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "E701"]
# Phrase banks and scenario scripts are data: one sentence per line reads better than wrapping.
"scripts/synthetic_data/*" = ["E501"]
"scripts/seed_synthetic.py" = ["E501"]
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "packages/evaluation-core/src:packages/bigquery-adapter/src:packages/openai-adapter/src:apps/workers/src:apps/console-executor/src:apps/api/src"

[[tool.mypy.overrides]]
module = ["google.*", "sqlglot.*", "jsonschema.*"]
ignore_missing_imports = true
follow_untyped_imports = true
disallow_untyped_calls = false
