[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
[tool.ruff]
line-length = 140
target-version = "py312"
src = ["apps/api/src", "packages/evaluation-core/src", "packages/bigquery-adapter/src"]
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "E701"]
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "packages/evaluation-core/src:packages/bigquery-adapter/src:apps/api/src"
