name: CI
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e packages/evaluation-core -e packages/bigquery-adapter -e packages/openai-adapter -e apps/workers -e 'apps/api[dev]'
      - run: pytest -q tests
      - run: ruff check apps/api/src packages/evaluation-core/src packages/bigquery-adapter/src packages/openai-adapter/src apps/workers/src tests
      - run: mypy packages/evaluation-core/src packages/bigquery-adapter/src packages/openai-adapter/src apps/workers/src
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infra/terraform
      - run: terraform -chdir=infra/terraform/environments/dev init -backend=false
      - run: terraform -chdir=infra/terraform/environments/dev validate
      - run: terraform -chdir=infra/terraform/environments/prod init -backend=false
      - run: terraform -chdir=infra/terraform/environments/prod validate
      # Validate only: CI never plans or applies against a real project.
