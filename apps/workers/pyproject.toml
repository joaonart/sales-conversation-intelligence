[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "sci-workers"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["sci-core", "sci-bq", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "google-auth>=2.30,<3", "google-cloud-tasks>=2.16,<3"]
[tool.setuptools.packages.find]
where = ["src"]
