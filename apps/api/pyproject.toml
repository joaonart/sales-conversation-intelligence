[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "sci-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["sci-core","fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1", "ruff>=0.8,<1", "mypy>=1.11,<2", "sqlglot>=25", "jsonschema>=4"]
[tool.setuptools.packages.find]
where = ["src"]
